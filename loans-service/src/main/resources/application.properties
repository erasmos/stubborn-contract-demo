spring.application.name=loans-service
catalog.base-url=http://localhost:8080
# Nothing connects to localhost:9092 until a message is sent, and tests replace it with an embedded broker.
spring.kafka.bootstrap-servers=localhost:9092
# Sends events as JSON (spring-kafka 4's Jackson 3 serializer).
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
