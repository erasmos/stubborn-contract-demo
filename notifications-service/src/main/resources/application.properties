spring.application.name=notifications-service
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notifications-service
# A new consumer group starts from the beginning of the topic rather than only new messages.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# Deserialise into our own BookCheckedOut, ignoring any type header naming the producer's class.
spring.kafka.consumer.properties.spring.json.value.default.type=com.erasmos.stubborncontractdemo.notifications.BookCheckedOut
spring.kafka.consumer.properties.spring.json.use.type.headers=false